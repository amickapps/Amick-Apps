function renderDetail(a) {
  let i = 0; const r = () => `class="reveal" style="--i:${i++}"`;

    ? `<a class="store" href="${a.appStore}"><img src="badges/app-store.svg" alt="Download on the App Store" onerror="this.parentNode.className='button';this.replaceWith('View on the App Store  →')"></a>`

  detail.innerHTML = `
    <div class="detail-inner">
      <button class="back reveal" style="--i:0" id="back">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>All apps

        <span class="icon${a.round ? " round" : ""}" id="heroIcon" style="visibility:hidden">${a.icon}</span>
        <h1 ${(i = 1, r())}>${a.name}</h1>
        <p class="tagline" ${r()}>${a.tagline}</p>
        <div class="meta" ${r()}>
          <div class="chips" aria-label="Runs on">${a.platforms.map(p => `<span class="chip">${DEVICE_ICONS[p] || ""}${p}</span>`).join("")}</div>
        </div>
        <div ${r()}>${store}</div>
      </section>

      <section class="section" ${r()}>
        <h2>Features</h2>
        <div class="features">${a.features.map(([t, d]) => `<div class="feature"><h3>${t}</h3><p>${d}</p></div>`).join("")}</div>
      </section>

      <section class="section" ${r()}>
        <h2>Screenshots</h2>
        ${tabs}
        <div class="shots" id="shots"></div>
      </section>

      <section class="section" ${r()} id="${a.id}-privacy">
        <h2>Privacy & support</h2>
        <div class="cards">
          <div class="card">
            <h3>Privacy</h3>
            <p>${a.privacy}</p>
            <a class="link" href="privacy.html#${a.id}">Full privacy policy</a>
          </div>
          <div class="card">
            <h3>Need help?</h3>
            <p>Found a bug or have an idea? I read every message and usually reply within a couple of days.</p>
            <a class="button" href="${mail(a.name + " support")}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg>Contact me
            </a>
          </div>
        </div>
      </section>
    </div>`;
  $("#back").onclick = () => { location.hash = ""; };

  const strip = $("#shots");
  const showSet = (k) => {
    const set = sets[k];
    strip.innerHTML = set
      ? set.files.map((f, n) => `<figure class="shot" style="--r:${set.ratio}"><img src="${f}" alt="${a.name} on ${set.device}, screenshot ${n + 1}" loading="lazy" decoding="async"></figure>`).join("")
      : [1, 2, 3].map(() => `<figure class="shot ph"><span>Screenshot coming soon</span></figure>`).join("");
    strip.scrollLeft = 0;
  };
  showSet(0);
  strip.addEventListener("click", (e) => {
    const fig = e.target.closest(".shot:not(.ph)");
    if (fig) openLightbox([...strip.querySelectorAll(".shot img")], [...strip.children].indexOf(fig));
  });

  const seg = $(".seg", detail);
  if (seg) {
    const pill = $(".seg-pill", seg);
    const move = (btn) => { pill.style.left = btn.offsetLeft + "px"; pill.style.width = btn.offsetWidth + "px"; };
    requestAnimationFrame(() => move($('[aria-selected="true"]', seg)));
    seg.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn || btn.getAttribute("aria-selected") === "true") return;
      seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b === btn));
      move(btn);
      strip.classList.add("swap");
      setTimeout(() => { showSet(+btn.dataset.k); strip.classList.remove("swap"); }, reduce ? 0 : 180);
    });
  }
}

// Fly an icon from one element's position to another's (FLIP)
function fly(from, to, html, duration = 560, round = false) {
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  if (reduce || !a.width || !b.width) return Promise.resolve();
  const c = document.createElement("div");
  c.className = "flyer";
  c.innerHTML = `<span class="icon${round ? " round" : ""}">${html}</span>`;
  Object.assign(c.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px" });
  document.body.append(c);
  const s = a.width / b.width;
  return c.animate([
    { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${s})` },
    { transform: "translate(0,0) scale(1.06)", offset: .82 },
    { transform: "none" }
  ], { duration, easing: "cubic-bezier(.2,.8,.2,1)" }).finished.then(() => c.remove());
}

// Tap a screenshot to view it full size
const lb = $("#lightbox"), lbImg = $("img", lb);
let lbList = [], lbIdx = 0;
function lbShow(n) {
  lbIdx = (n + lbList.length) % lbList.length;
  lbImg.src = lbList[lbIdx].src; lbImg.alt = lbList[lbIdx].alt;
  lb.classList.toggle("single", lbList.length < 2);
}
function openLightbox(imgs, n) {
  lbList = imgs; lbShow(n); lb.hidden = false;
  requestAnimationFrame(() => lb.classList.add("on"));
}
function closeLightbox() {
  lb.classList.remove("on");
  setTimeout(() => { lb.hidden = true; }, reduce ? 0 : 250);
}
lb.addEventListener("click", (e) => {
  if (e.target.closest(".lb-prev")) lbShow(lbIdx - 1);
  else if (e.target.closest(".lb-next")) lbShow(lbIdx + 1);
  else if (e.target !== lbImg) closeLightbox();
});
let touchX = null;
lb.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
lb.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX; touchX = null;
  if (Math.abs(dx) > 40) lbShow(lbIdx + (dx < 0 ? 1 : -1));
});

let current = null, busy = false;

async function open(id, animate = true) {
  const a = apps.find(x => x.id === id);
  if (!a || busy || current === id) return;
  busy = true; current = id;
  const tileIcon = $(`.tile[data-id="${id}"] .icon`);
  document.documentElement.style.setProperty("--glow", a.color);
  document.title = `${a.name} — Amick Apps`;
  renderDetail(a);
  detail.hidden = false; detail.scrollTop = 0;
  document.body.classList.add("locked");
  tileIcon.style.visibility = "hidden";
  requestAnimationFrame(() => document.body.classList.add("open"));
  if (animate) await fly(tileIcon, $("#heroIcon"), a.icon, 560, a.round);
  $("#heroIcon").style.visibility = "visible";
  tileIcon.style.visibility = "";
  busy = false;
}

async function close() {
  if (!current || busy) return;
  busy = true;
  const tileIcon = $(`.tile[data-id="${current}"] .icon`), hero = $("#heroIcon");
  const a = apps.find(x => x.id === current);
  document.body.classList.add("closing");
  document.body.classList.remove("open");
  tileIcon.style.visibility = "hidden";
  hero.style.visibility = "hidden";
  await fly(hero, tileIcon, a.icon, 480, a.round);
  tileIcon.style.visibility = "";
  detail.hidden = true; detail.innerHTML = "";
  document.body.classList.remove("locked", "closing");
  document.documentElement.style.setProperty("--glow", "#6b7cff");
  document.title = "Amick Apps";
  current = null; busy = false;
}

addEventListener("hashchange", () => {
  const id = location.hash.slice(1).replace(/-privacy$/, "");
  id && apps.some(a => a.id === id) ? open(id) : close();
});
addEventListener("keydown", e => {
  if (!lb.hidden) {
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowRight") lbShow(lbIdx + 1);
    if (e.key === "ArrowLeft") lbShow(lbIdx - 1);
    return;
  }
  if (e.key === "Escape" && current) location.hash = "";
});

// Deep links like amick.app/#robodraft open straight to that app
const start = location.hash.slice(1);
const startId = start.replace(/-privacy$/, "");
if (apps.some(a => a.id === startId)) {
  open(startId, false).then(() => start.endsWith("-privacy") && document.getElementById(start)?.scrollIntoView());
}
</script>
</body>
